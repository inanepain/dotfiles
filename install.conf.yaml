- defaults:
    link:
      create: true
      relink: true

#region CREATE
# XDG
- create:
    - ~/.local
    - ~/.local/share
    - ~/.local/state
    - ~/.config
    - ~/.cache

# ZSH
- create:
    - ~/.zsh.d

# BIN
- create:
    - ~/bin
    - ~/bin/functions

# OTHER
- create:
    - ~/doc
    - ~/lib
    - ~/etc
    - ~/etc/oh-my-zsh

# MAN
- create:
    - ~/man
    - ~/man/man1
    - ~/man/man2
    - ~/man/man3
    - ~/man/man4
    - ~/man/man5
    - ~/man/man6
    - ~/man/man7
    - ~/man/man8
#endregion CREATE

#region ZSH
# ZSH: INCLUDE
- link:
   ~/.zsh.d/include/:
      glob: true
      path: home/zsh.d/include/*

# ZSH: CONFIG
- link:
   ~/.zsh.d/blackbetty.env:
      if: '[ `uname -n` = BlackBetty.local ]'
      path: home/zsh.d/blackbetty.env
   ~/.zsh.d/blackbetty.zsh:
      if: '[ `uname -n` = BlackBetty.local ]'
      path: home/zsh.d/blackbetty.zsh
   ~/.zsh.d/blackbetty.zshrc:
      if: '[ `uname -n` = BlackBetty.local ]'
      path: home/zsh.d/blackbetty.zshrc
   ~/.zsh.d/kycdd-003.env:
      if: '[ `uname -n` = kycdd-003 ]'
      path: home/zsh.d/kycdd-003.env
   ~/.zsh.d/kycdd-003.zsh:
      if: '[ `uname -n` = kycdd-003 ]'
      path: home/zsh.d/kycdd-003.zsh
   ~/.zsh.d/kycdd.dev.env:
      if: '[ `uname -n` = kycdd.dev ]'
      path: home/zsh.d/kycdd.dev.env
   ~/.zsh.d/kycdd.dev.zsh:
      if: '[ `uname -n` = kycdd.dev ]'
      path: home/zsh.d/kycdd.dev.zsh
   ~/.zsh.d/kycdd.dev.zshrc:
      if: '[ `uname -n` = kycdd.dev ]'
      path: home/zsh.d/kycdd.dev.zshrc
   ~/.zsh.d/kycx.zsh:
      if: '[ `uname -n` = kycx ]'
      path: home/zsh.d/kycx.zsh
   ~/.zsh.d/kycx.zshrc:
      if: '[ `uname -n` = kycx ]'
      path: home/zsh.d/kycx.zshrc

# ZSH: CORE
- link:
    ~/.zshenv: zsh/zshenv
    ~/.zprofile: zsh/zprofile
    ~/.zshrc: zsh/zshrc
    ~/.zlogin: zsh/zlogin
    ~/.zlogout: zsh/zlogout

# ZSH: BIN
- link:
    ~/bin/action-picker.zsh: home/bin/action-picker.zsh
    ~/bin/bubu.zsh: home/bin/bubu.zsh
    ~/bin/ckhash.zsh: home/bin/ckhash.zsh
    ~/bin/fresh-upgrade.zsh:
        if: '[ ! `uname -n` = BlackBetty.local ]'
        path: home/bin/fresh-upgrade.zsh
    ~/bin/gitea-upgrade.zsh: home/bin/gitea-upgrade.zsh
    ~/bin/iblocklist-update.zsh: home/bin/iblocklist-update.zsh
    ~/bin/kitty-installer.sh:
        if: '[ `uname -n` = BlackBetty.local ]'
        path: home/bin/kitty-installer.sh

# ZSH: BIN: FUNCTIONS
- link:
   ~/bin/functions/:
    glob: true
    path: home/bin/functions/*
#endregion ZSH

#region OHMYZSH
# OH-MY-ZSH
- link:
   ~/.oh-my-zsh/custom/000-env.zsh: ohmyzsh/custom/000-env.zsh
   ~/.oh-my-zsh/custom/002-app.zsh: ohmyzsh/custom/002-app.zsh
   ~/.oh-my-zsh/custom/007-env-eza.zsh: ohmyzsh/custom/007-env-eza.zsh
   ~/.oh-my-zsh/custom/010-java.zsh:
     if: '[ ! `uname -n` = kycu ]'
     path: ohmyzsh/custom/010-java.zsh

- link:
   ~/.oh-my-zsh/custom/050-aliases.zsh: ohmyzsh/custom/050-aliases.zsh
   ~/.oh-my-zsh/custom/051-aliases-php.zsh: ohmyzsh/custom/051-aliases-php.zsh
   ~/.oh-my-zsh/custom/051-aliases-suffix.zsh: ohmyzsh/custom/051-aliases-suffix.zsh
   ~/.oh-my-zsh/custom/051-aliases-directory.zsh:
     if: '[ `uname -n` = BlackBetty.local ]'
     path: ohmyzsh/custom/051-aliases-directory.zsh
   ~/.oh-my-zsh/custom/051-aliases-global.zsh: ohmyzsh/custom/051-aliases-global.zsh
   ~/.oh-my-zsh/custom/052-aliases-git.zsh: ohmyzsh/custom/052-aliases-git.zsh

- link:   
   ~/.oh-my-zsh/custom/060-cmd.zsh: ohmyzsh/custom/060-cmd.zsh
   ~/.oh-my-zsh/custom/061-cmd-atuin.zsh: 
     if: '[ ! `uname -n` = kycu  ]'
     path: ohmyzsh/custom/061-cmd-atuin.zsh
   ~/.oh-my-zsh/custom/061-cmd-boring.zsh: ohmyzsh/custom/061-cmd-boring.zsh
   ~/.oh-my-zsh/custom/061-cmd-broot.zsh: ohmyzsh/custom/061-cmd-broot.zsh
   ~/.oh-my-zsh/custom/061-cmd-folderify.zsh: ohmyzsh/custom/061-cmd-folderify.zsh
   ~/.oh-my-zsh/custom/061-cmd-ghq.zsh: ohmyzsh/custom/061-cmd-ghq.zsh
   ~/.oh-my-zsh/custom/061-cmd-hurl.zsh: ohmyzsh/custom/061-cmd-hurl.zsh
   ~/.oh-my-zsh/custom/061-cmd-intelli-shell.zsh: ohmyzsh/custom/061-cmd-intelli-shell.zsh
   ~/.oh-my-zsh/custom/061-cmd-iterm.zsh: ohmyzsh/custom/061-cmd-iterm.zsh
   ~/.oh-my-zsh/custom/061-cmd-lla.zsh: ohmyzsh/custom/061-cmd-lla.zsh
   ~/.oh-my-zsh/custom/061-cmd-moor.zsh: ohmyzsh/custom/061-cmd-moor.zsh
   ~/.oh-my-zsh/custom/061-cmd-navi.zsh: ohmyzsh/custom/061-cmd-navi.zsh
   ~/.oh-my-zsh/custom/061-cmd-pet.zsh: ohmyzsh/custom/061-cmd-pet.zsh
   ~/.oh-my-zsh/custom/061-cmd-sqlite3.zsh: ohmyzsh/custom/061-cmd-sqlite3.zsh
   ~/.oh-my-zsh/custom/061-cmd-todo.zsh: ohmyzsh/custom/061-cmd-todo.zsh
   ~/.oh-my-zsh/custom/061-cmd-zsh-patina.zsh: ohmyzsh/custom/061-cmd-zsh-patina.zsh

- link:
   ~/.oh-my-zsh/custom/500-colours.zsh: ohmyzsh/custom/500-colours.zsh
   ~/.oh-my-zsh/custom/900-functions.zsh: ohmyzsh/custom/900-functions.zsh
   ~/.oh-my-zsh/custom/910-completions.zsh: ohmyzsh/custom/910-completions.zsh
   ~/.oh-my-zsh/custom/920-keybindings.zsh: ohmyzsh/custom/920-keybindings.zsh

- link:
   ~/.oh-my-zsh/custom/950-gh-token.zsh: ohmyzsh/custom/950-gh-token.zsh
#endregion OHMYZSH

#region CONFIG
# CONFIG: ZSH-PATINA
- link:
    ~/.config/atuin:
        glob: true
        path: home/config/atuin/*
    ~/.config/direnv:
        glob: true
        path: home/config/direnv/*
    ~/.config/starship:
        glob: true
        path: home/config/starship/*
    ~/.config/zsh-patina:
        glob: true
        path: home/config/zsh-patina/*
#endregion CONFIG

- link:
   ~/.netrc: home/netrc
   
- link:
   ~/etc/mysql/my.cnf: home/etc/mysql/my.cnf

- clean: ['~', '~/bin', '~/bin/functions', '~/.oh-my-zsh/custom', '~/.zsh.d']
