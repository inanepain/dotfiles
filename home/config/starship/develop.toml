# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

#region PROMPT
# Inserts a blank line between shell prompts
add_newline = false

# A continuation prompt that displays two filled in arrows
continuation_prompt = "[∙](bright-blue) "

format = """
[$time$memory_usage$jobs$directory$git_branch$git_status](bold dimmed purple)
$sudo$username$character"""

# move the rest of the prompt to the right
right_format = """[$cmd_duration$php$nodejs$direnv$battery$status](bold dimmed purple)"""
#endregion PROMPT

#region BATTERY
[battery]
# symbols = "󰂎💀💧🫗🔋🪫🔌💡🔦🪔⌛️⏳📈📉➕➖⌁💦☇▼▽⚡︎☠︎⏚⇣↓"
full_symbol = "🔋 "
empty_symbol = "🪫 "
charging_symbol = "⚡️ "
discharging_symbol = "⚡︎ "
format = '\[[$symbol$percentage]($style)\]'

[[battery.display]] # style when capacity is between 0% and 10%
threshold = 10
style = "bold red"
discharging_symbol = "💀 "

[[battery.display]] # style when capacity is between 10% and 20%
threshold = 20
style = "bold yellow"
discharging_symbol = "🧊 "

[[battery.display]] # style when capacity is between 20% and 30%
threshold = 30
style = "bold yellow"
discharging_symbol = "💧 "

[[battery.display]] # style when capacity is between 30% and 80%
threshold = 79
style = "default"

# [[battery.display]] # style when capacity is 100%
# threshold = 100
# style = "bold purple"
#endregion BATTERY

# Replace the "❯" symbol in the prompt with "➜" ➜➤▷
[character] # The name of the module we are configuring is "character"
format = '$symbol'
success_symbol = "[〉](bold green)" # The "success_symbol" segment is being set to "➜" with the colour "bold green"

[cmd_duration]
min_time = 500
format = '\[[⏱ $duration]($style)\]'

[directory]
style = "cyan"
truncation_symbol = "…/"
# truncation_length = 3
home_symbol = "🏠"
format = '(\[[$path]($style)[$read_only]($read_only_style)\])'
substitutions = [
  { from = "🏠/Library/Mobile Documents/com~apple~CloudDocs", to = "☁️ " },
  { from = "🏠/Sites", to = "🌍" },
#   { from = "^/", to = "<root>/", regex = true },
#   { from = "^<root>", to = "/", regex = true },
]

[direnv]
# symbols: ⌂🗂️📂📁🗃️📁
disabled = false
symbol = '📂'
allowed_msg = '✔︎'
not_allowed_msg = '✘'
denied_msg = '⛔︎'
loaded_msg = ' ✔︎'
unloaded_msg = ' ✘'
style = 'cyan'
format = '([\[$symbol($loaded/$allowed)\]]($style))'

[git_branch]
symbol = ""
style = 'purple'
format = '\[[$symbol$branch]($style)\]'

[git_status]
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '[++\($count\)](green)'
format = '([\[$all_status$ahead_behind\]]($style))'

[package]
disabled = true
symbol = ''
style = 'bright-black'
# display_private = true
format = '[\($symbol$version\)]($style)'

[memory_usage]
disabled = false
threshold = -1
style = "bold dimmed green"
format = '\[$symbol[[$ram_pct](bold dimmed blue)([|](dimmed red)[$swap_pct](bold dimmed yellow))]($style)\]'
# symbol = " "

[nodejs]
format = '([\[$symbol($version)\]]($style))'

[php]
version_format = "v${raw}"
symbol = "🐘 "
format = '\[[$symbol($version)]($style)\]'

[shell]
format = '\[[$indicator]($style)\]'
# disabled = false

[status]
disabled = false
format = '\[[$symbol$status]($style)\]'

[sudo]
disabled = false
symbol = '🫆 '
format = '[$symbol]($style)'

[time]
disabled = false
style = "bold dimmed blue"
format = '\[[$time]($style)\]'

[username]
disabled = false
show_always = true
format = '[$user]($style)'
style_user = 'purple'