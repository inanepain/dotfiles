# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false

# A continuation prompt that displays two filled in arrows
continuation_prompt = "[∙](bright-blue) "

# A minimal left prompt
# format = """$directory\
# $git_branch\
# $git_status
# $character"""

format = """
[$time$memory_usage$jobs$directory$git_branch$git_status](bold dimmed purple)
$sudo$username$character"""

# move the rest of the prompt to the right
right_format = """[$cmd_duration$php$nodejs$direnv$battery$status$hostname](bold dimmed purple)"""

[battery]
# symbols = "󰂎💀💧🫗🔋🪫🔌💡🔦🪔⌛️⏳📈📉➕➖⌁💦☇▼▽⚡︎☠︎⏚⇣↓"
full_symbol = "🔋 "
empty_symbol = "🪫 "
charging_symbol = "⚡️ "
discharging_symbol = "⚡︎ "
format = '\[[$symbol$percentage]($style)\]'

[[battery.display]] # style when capacity is between 0% and 10%
threshold = 10
style = "bold red"
discharging_symbol = "💀 "

[[battery.display]] # style when capacity is between 10% and 20%
threshold = 20
style = "bold yellow"
discharging_symbol = "🧊 "

[[battery.display]] # style when capacity is between 20% and 30%
threshold = 30
style = "bold yellow"
discharging_symbol = "💧 "

[[battery.display]] # style when capacity is between 30% and 80%
threshold = 80
style = "default"

[[battery.display]] # style when capacity is 100%
threshold = 100
style = "bold purple"

# Replace the "❯" symbol in the prompt with "➜" ➜➤▷
[character] # The name of the module we are configuring is "character"
format = '$symbol'
success_symbol = "[〉](bold green)" # The "success_symbol" segment is being set to "➜" with the colour "bold green"

[cmd_duration]
min_time = 500
format = '\[[⏱ $duration]($style)\]'

[directory]
style = "cyan"
truncation_symbol = "…/"
# truncation_length = 3
home_symbol = "🏠"
format = '(\[[$path]($style)[$read_only]($read_only_style)\])'

[direnv]
# symbols: ⌂🗂️📂📁
disabled = false
symbol = "📁 "
allowed_msg = "✔︎"
loaded_msg = "✔︎"
style = "bold bright-yellow"
format = '([\[$symbol($loaded/$allowed)\]]($style))'

[env_var.USER]
style = "purple"
format = '[$env_value]($style)'
default = "unknown user"

[git_branch]
symbol = ""
style = 'purple'
format = '\[[$symbol$branch]($style)\]'

[git_status]
# modified = ''
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '[++\($count\)](green)'
format = '([\[$all_status$ahead_behind\]]($style))'
# up_to_date = '✓'
# conflicted = '🏳'
# ahead = '🏎💨'
# behind = '😰'
# diverged = '😵'
# up_to_date = '✓'
# untracked = '🤷'
# stashed = '📦'
# modified = '📝'
# staged = '[++\($count\)](green)'
# renamed = '👅'
# deleted = '🗑'

[hostname]
disabled = false
ssh_only = false
format = '[$ssh_symbol](bold blue)[$hostname](bright-purple)'
# format = '[$ssh_symbol](bold blue) on [$hostname](bold red) '
# trim_at = '.companyname.com'

[package]
disabled = true

[memory_usage]
disabled = false
threshold = -1
style = "bold dimmed green"
format = '\[$symbol[[$ram_pct](bold dimmed blue)([|](dimmed red)[$swap_pct](bold dimmed yellow))]($style)\]'
# symbol = " "

[nodejs]
format = '([\[$symbol($version)\]]($style))'

[php]
version_format = "v${raw}"
symbol = "🐘 "
format = '\[[$symbol($version)]($style)\]'

[shell]
format = '\[[$indicator]($style)\]'
# disabled = false

[status]
disabled = false
format = '\[[$symbol$status]($style)\]'

[sudo]
disabled = false
symbol = '🫆 '
format = '[$symbol]($style)'
# style = 'bold green'
# symbol = '👩‍💻 '

[time]
disabled = false
style = "bold dimmed blue"
format = '\[[$time]($style)\]'

[username]
disabled = false
show_always = true
format = '[$user]($style)'
style_user = 'purple'